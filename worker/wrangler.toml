name = "bhm-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Account ID - replace with your Cloudflare account ID
# account_id = "your-account-id"

# Workers configuration
workers_dev = true

# Environment variables
[vars]
CORE_API_BASE = "http://localhost:4000"
ENVIRONMENT = "development"

# Secrets (set via wrangler secret put)
# Run: wrangler secret put SERVICE_SECRET
# Run: wrangler secret put JWT_SECRET

# KV Namespaces for caching (optional)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Rate limiting (requires Workers Paid plan)
# [limits]
# cpu_ms = 50

# Production environment
[env.production]
name = "bhm-api-production"
workers_dev = false

[env.production.vars]
CORE_API_BASE = "https://api.yourdomain.com"
ENVIRONMENT = "production"

# Staging environment
[env.staging]
name = "bhm-api-staging"
workers_dev = false

[env.staging.vars]
CORE_API_BASE = "https://api-staging.yourdomain.com"
ENVIRONMENT = "staging"
